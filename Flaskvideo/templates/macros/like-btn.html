{% macro like_btn(pressed, for) %}
{% if pressed %}
    <a class="like-btn-pressed" href="#">
        {{ for['like_count'] }} <span></span>
    </a>
{% else %}
    <a class="like-btn" href="#">
        {{ for['like_count'] }} <span></span>
    </a>
{% endif %}
{% endmacro %}
